<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">

<title>📚 中一數學配對卡牌 — 課題瀏覽器</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
  .header{background:#161b22;border-bottom:1px solid #30363d;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
  .header h1{font-size:1.1rem;color:#58a6ff;flex:1}
  select{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:7px 14px;font-size:.9rem;cursor:pointer}
  .main{padding:24px 16px;max-width:1200px;margin:0 auto}
  .chapter-title{color:#58a6ff;font-size:1.3rem;margin-bottom:4px}
  .chapter-desc{color:#8b949e;font-size:.85rem;margin-bottom:20px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
  .pair{border:1px solid #30363d;border-radius:14px;overflow:hidden;background:#161b22}
  .pair-header{padding:7px 14px;background:rgba(88,166,255,.07);border-bottom:1px solid #21262d;font-size:.72rem;color:#58a6ff;letter-spacing:1.5px;text-transform:uppercase}
  .pair-body{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:5/4;min-height:200px}
  .card-algebra,.card-graph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 10px;text-align:center;overflow:hidden}
  .card-algebra{background:linear-gradient(135deg,#1a2d4a,#0f1f35);border-right:1px solid #21262d}
  .card-graph{background:linear-gradient(135deg,#0f2a1f,#091510}
  .card-label{font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;opacity:.55}
  .card-algebra .card-label{color:#79c0ff}
  .card-graph .card-label{color:#56d364}
  .card-text{font-size:1.05rem;font-weight:700;color:#58a6ff;line-height:1.3}
  .card-graph svg{width:100%;height:auto;max-height:150px}
  @media(max-width:600px){.card-grid{grid-template-columns:1fr}}
  @media print{body{background:white;color:black}.header{display:none}.card-grid{grid-template-columns:1fr}.pair{border:1px solid #000}}
</style>
</head>

<div class="header">

    <option value="ch1">Ch1 — 基礎計算</option>
